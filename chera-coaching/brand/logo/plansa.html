<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Arial;background:#777}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cell{padding:48px;display:grid;place-items:center;min-height:300px}
.d{background:#0e0d0d}.l{background:#f5f1ec}.r{background:#e1251b}
.cell img{max-width:100%;max-height:260px}
.small{display:flex;gap:40px;align-items:center;justify-content:center}
</style></head><body>
<div class="row"><div class="cell d"><img src="chera-protocol-orizontal-inchis.svg"></div><div class="cell l"><img src="chera-protocol-orizontal-deschis.svg"></div></div>
<div class="row"><div class="cell d" style="min-height:520px"><img src="chera-protocol-vertical-inchis.svg" style="max-height:480px"></div><div class="cell l" style="min-height:520px"><img src="chera-protocol-vertical-deschis.svg" style="max-height:480px"></div></div>
<div class="row"><div class="cell d small"><img src="chera-protocol-marca.svg" style="height:200px"><img src="chera-protocol-marca.svg" style="height:64px"><img src="chera-protocol-marca.svg" style="height:32px"><img src="chera-protocol-marca.svg" style="height:16px"></div><div class="cell l small"><img src="chera-protocol-marca-deschis.svg" style="height:200px"><img src="chera-protocol-wordmark-deschis.svg" style="height:40px"></div></div>
<div class="row"><div class="cell r"><img src="chera-protocol-orizontal-alb.svg"></div><div class="cell l"><img src="chera-protocol-orizontal-negru.svg"></div></div>
</body></html>
