<style>
/* Prime – pagina de produs vizuală, v2 (15.11.2026): mai deschisă și mai „prietenoasă”, la cererea lui Marius
   (stil inspirat de structura de la Genius Nutrition: degrade deschis, plăcuțe închise pentru cifre, poză cu carduri
   transparente peste ea; codul și culorile sunt ale noastre). Tot CSS-ul e sub .ppv și nu atinge restul temei.
   Culoarea de accent vine din „tema” produsului (clasa ppv--rosu / albastru / verde / mov / portocaliu / roz). */
.ppv{
  --ppv-acc:#e91d23; --ppv-tint:#fdecee; --ppv-tint-2:#fff7f7;
  --ppv-ink:#14171f; --ppv-text-c:#3b4150; --ppv-muted:#6b7280;
  --ppv-card:#ffffff; --ppv-line:rgba(20,23,31,.08);
  --ppv-shadow:0 10px 30px rgba(20,23,31,.06); --ppv-shadow-lg:0 24px 60px rgba(20,23,31,.10);
  --ppv-r:16px; --ppv-r-lg:28px;
  --ppv-font:Poppins,Barlow,system-ui,sans-serif;
  color:var(--ppv-text-c); font-family:var(--ppv-font); font-size:15.5px; line-height:1.7;
  container-type:inline-size;
}
.ppv--rosu{--ppv-acc:#e91d23;--ppv-tint:#fdecee;--ppv-tint-2:#fff7f7}
.ppv--albastru{--ppv-acc:#2563eb;--ppv-tint:#e8efff;--ppv-tint-2:#f6f9ff}
.ppv--verde{--ppv-acc:#16a34a;--ppv-tint:#e6f7ec;--ppv-tint-2:#f5fcf7}
.ppv--mov{--ppv-acc:#7c3aed;--ppv-tint:#f0e9ff;--ppv-tint-2:#faf7ff}
.ppv--portocaliu{--ppv-acc:#ea580c;--ppv-tint:#ffeee3;--ppv-tint-2:#fff9f5}
.ppv--roz{--ppv-acc:#db2777;--ppv-tint:#fde8f2;--ppv-tint-2:#fff7fb}

.ppv *,.ppv *::before,.ppv *::after{box-sizing:border-box}
/* :where() = specificitate zero, ca stilurile componentelor să nu fie anulate de reset */
.ppv :where(h2,h3,h4,p,ul,li,figure){margin:0;padding:0}
.ppv :where(ul){list-style:none}
/* tema are h1–h6 {font-family:"Bebas Neue" !important}; aici titlurile sunt Poppins, grele, ca textul să fie „clar” */
.ppv h2,.ppv h3,.ppv h4{font-family:var(--ppv-font)!important;color:var(--ppv-ink);text-transform:none;letter-spacing:-.02em;font-weight:800}
.ppv h2{font-size:clamp(30px,4.4vw,52px);line-height:1.04}
.ppv h3{font-size:clamp(22px,2.6vw,32px);line-height:1.12;margin-bottom:14px}
.ppv h4{font-size:15.5px;line-height:1.35;letter-spacing:-.01em;font-weight:700;margin-bottom:6px}

.ppv__wrap{max-width:1200px;margin:0 auto;padding:0 16px;display:grid;gap:28px}
.ppv-panel{border-radius:var(--ppv-r-lg);padding:clamp(22px,4vw,48px);background:linear-gradient(135deg,var(--ppv-tint) 0%,var(--ppv-tint-2) 42%,#fff 75%)}
.ppv-kicker{display:block;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ppv-acc);margin-bottom:10px}

/* Hero */
.ppv-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,48px);align-items:center}
.ppv-badge{display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid color-mix(in srgb,var(--ppv-acc) 22%,transparent);color:var(--ppv-acc);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:22px}
.ppv-badge span+span::before{content:"•";margin-right:8px;opacity:.7}
.ppv-intro{margin-top:20px;font-size:16.5px;color:var(--ppv-text-c)}
.ppv-hl{color:var(--ppv-acc);font-weight:700}
.ppv-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.ppv-tags li{display:inline-flex;align-items:center;gap:8px;background:var(--ppv-ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;line-height:1.2}
.ppv-tags li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ppv-acc);flex:0 0 7px}

.ppv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.ppv-stat{background:var(--ppv-ink);color:#fff;border-radius:20px;padding:20px 12px;text-align:center;box-shadow:var(--ppv-shadow)}
.ppv-stat__v{font-size:clamp(28px,3.2vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1}
.ppv-stat__v small{font-size:.5em;margin-left:2px;font-weight:700}
.ppv-stat__l{margin-top:8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72);line-height:1.35}
.ppv-footnote{margin-top:10px;font-size:12px;color:var(--ppv-muted)}

.ppv-media{position:relative;border-radius:var(--ppv-r-lg);overflow:hidden;background:#fff;box-shadow:var(--ppv-shadow-lg);aspect-ratio:4/5}
.ppv-media img{display:block;width:100%;height:100%;object-fit:cover}
.ppv-media--produs img{object-fit:contain;padding:8%}
.ppv-minis{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ppv-mini{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;padding:14px 16px;box-shadow:0 6px 20px rgba(20,23,31,.10)}
.ppv-mini b{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ppv-ink);margin-bottom:4px}
.ppv-mini span{display:block;font-size:13px;line-height:1.45;color:var(--ppv-text-c)}

/* Carduri */
.ppv-two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.ppv-card{background:var(--ppv-card);border:1px solid var(--ppv-line);border-radius:var(--ppv-r-lg);padding:clamp(22px,3vw,36px);box-shadow:var(--ppv-shadow)}
.ppv-card--tint{background:linear-gradient(160deg,var(--ppv-tint-2),#fff 70%);border-color:color-mix(in srgb,var(--ppv-acc) 14%,transparent)}
.ppv-rows li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--ppv-line);font-size:14.5px}
.ppv-rows li:last-child{border-bottom:0}
.ppv-rows b{color:var(--ppv-ink);white-space:nowrap}
.ppv-checks li{position:relative;padding:9px 0 9px 34px;font-size:14.5px}
/* bifa e desenată din CSS (fără caractere speciale) – nu se poate strica la copiere, ca „¹4” la concurent */
.ppv-checks li::before{content:"";position:absolute;left:0;top:11px;width:22px;height:22px;border-radius:50%;background:var(--ppv-tint)}
.ppv-checks li::after{content:"";position:absolute;left:8px;top:15px;width:6px;height:11px;border:solid var(--ppv-acc);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}

/* Rolul fiecărui ingredient */
.ppv-head{max-width:720px;margin-bottom:22px}
.ppv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ppv-ing{background:#fff;border:1px solid var(--ppv-line);border-radius:22px;padding:22px;box-shadow:var(--ppv-shadow)}
.ppv-ing__code{display:inline-grid;place-items:center;min-width:48px;height:48px;padding:0 10px;border-radius:14px;background:var(--ppv-tint);color:var(--ppv-acc);font-size:14px;font-weight:800;letter-spacing:.04em;margin-bottom:14px}
.ppv-ing p{font-size:14px;color:var(--ppv-muted);line-height:1.6}

/* Arome + mod de folosire */
.ppv-flav{display:grid;gap:10px}
.ppv-flav li{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;padding:12px 16px;border-radius:16px;background:#f7f8fa;border:1px solid transparent}
.ppv-flav li[aria-current="true"]{background:var(--ppv-tint-2);border-color:var(--ppv-acc)}
.ppv-flav b{font-size:14px;color:var(--ppv-ink)}
.ppv-flav span{font-size:13.5px;color:var(--ppv-muted)}
.ppv-note{font-size:12.5px;color:var(--ppv-muted);margin-top:14px}
.ppv-todo{background:#fff3b0;color:#5a4a00;border-radius:4px;padding:0 4px;font-weight:600}

/* Tabletă și telefon: după lățimea secțiunii (container), nu a ecranului */
@container (max-width:920px){
  .ppv-hero,.ppv-two{grid-template-columns:1fr}
  .ppv-media{max-width:520px;width:100%;margin:0 auto}
  .ppv-grid{grid-template-columns:1fr 1fr}
}
@container (max-width:620px){
  .ppv-stats{grid-template-columns:1fr 1fr}
  .ppv-grid{grid-template-columns:1fr}
  .ppv-badge{border-radius:18px}
  .ppv-minis{grid-template-columns:1fr}
  .ppv-mini:nth-child(2){display:none}
  .ppv-flav li{grid-template-columns:1fr;gap:2px}
  .ppv-intro{font-size:15.5px}
}

</style>

<script>
  // Imaginile variantelor (în temă vin din Shopify; aici doar pentru produsele fără poză din ședință).
  var VAR_IMG = {
    'recovery-bcaa-500g': {
      Cherry: 'https://cdn.shopify.com/s/files/1/0917/5138/3415/files/01_PRIME_RECOVERYBCAA_Cherry_500g_front.jpg?v=1749666717',
      Pear: 'https://cdn.shopify.com/s/files/1/0917/5138/3415/files/01_PRIME_RECOVERYBCAA_Pear_500g_front.jpg?v=1749666717'
    }
  };
  var ALL = JSON.parse(document.getElementById('ppv-data').textContent);
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function todo(s) { return e(s).replace(/DE VERIFICAT/g, '<span class="ppv-todo">DE VERIFICAT</span>'); }
  function hl(s) { return todo(s).replace(/\[\[/g, '<strong class="ppv-hl">').replace(/\]\]/g, '</strong>'); }
  function list(a, f) { return (a || []).map(f).join(''); }
  function w(u, n) { return u + (u.indexOf('?') > -1 ? '&' : '?') + 'width=' + n; }

  function render(h, variant) {
    var d = ALL[h];
    var tema = ['albastru', 'verde', 'mov', 'portocaliu', 'roz'].indexOf(d.tema) > -1 ? d.tema : 'rosu';
    var vimg = VAR_IMG[h] && VAR_IMG[h][variant];
    var o = '<section class="ppv ppv--' + tema + '" id="ppv-demo" style="padding:24px 0 56px"><div class="ppv__wrap">';
    o += '<div class="ppv-panel ppv-hero"><div>';
    o += '<p class="ppv-badge">' + list(d.badge, function (b) { return '<span>' + e(b) + '</span>'; }) + '</p>';
    o += '<h2>' + e(d.titlu) + '</h2><p class="ppv-intro">' + hl(d.intro) + '</p>';
    o += '<ul class="ppv-tags">' + list(d.etichete, function (t) { return '<li>' + e(t) + '</li>'; }) + '</ul>';
    o += '<ul class="ppv-stats">' + list(d.cifre, function (c) { return '<li class="ppv-stat"><div class="ppv-stat__v">' + e(c.valoare) + (c.unitate ? '<small>' + e(c.unitate) + '</small>' : '') + '</div><div class="ppv-stat__l">' + e(c.eticheta) + '</div></li>'; }) + '</ul>';
    if (d.nota_cifre) o += '<p class="ppv-footnote">' + e(d.nota_cifre) + '</p>';
    o += '</div>';
    if (d.imagine && d.imagine.url) o += '<figure class="ppv-media"><img alt="' + e(d.imagine.alt) + '" src="' + w(d.imagine.url, 900) + '">';
    else o += '<figure class="ppv-media ppv-media--produs"><img alt="" src="' + (vimg ? w(vimg, 900) : '') + '">';
    o += '<div class="ppv-minis">' + list(d.mini_carduri, function (m) { return '<div class="ppv-mini"><b>' + e(m.titlu) + '</b><span>' + e(m.text) + '</span></div>'; }) + '</div></figure></div>';
    o += '<div class="ppv-two"><div class="ppv-card ppv-card--tint"><span class="ppv-kicker">' + e(d.card_formula.eticheta) + '</span><h3>' + e(d.card_formula.titlu) + '</h3><ul class="ppv-rows">';
    o += list(d.card_formula.randuri, function (r) { return '<li><span>' + e(r.nume) + '</span><b>' + e(r.valoare) + '</b></li>'; }) + '</ul></div>';
    o += '<div class="ppv-card"><span class="ppv-kicker">Pe scurt</span><h3>' + e(d.card_puncte.titlu) + '</h3><ul class="ppv-checks">' + list(d.card_puncte.puncte, function (p) { return '<li>' + e(p) + '</li>'; }) + '</ul></div></div>';
    o += '<div><div class="ppv-head"><span class="ppv-kicker">Formula</span><h3>' + e(d.carduri_ingrediente.titlu) + '</h3></div><div class="ppv-grid">';
    o += list(d.carduri_ingrediente.carduri, function (c) { return '<div class="ppv-ing"><span class="ppv-ing__code" aria-hidden="true">' + e(c.cod) + '</span><h4>' + e(c.titlu) + '</h4><p>' + e(c.text) + '</p></div>'; }) + '</div></div>';
    o += '<div class="ppv-two">';
    if (d.arome && d.arome.length) {
      o += '<div class="ppv-card"><span class="ppv-kicker">Arome</span><h3>' + d.arome.length + (d.arome.length === 1 ? ' aromă' : ' arome') + '</h3><ul class="ppv-flav">';
      o += list(d.arome, function (a) { return '<li data-ppv-flavour="' + e(a.varianta) + '" aria-current="' + (a.varianta === variant) + '"><b>' + e(a.nume) + '</b><span>' + todo(a.nota) + '</span></li>'; }) + '</ul></div>';
    }
    o += '<div class="ppv-card ppv-card--tint"><span class="ppv-kicker">Mod de folosire</span><h3>Cum îl prepari</h3><p>' + e(d.mod_de_folosire) + '</p><p class="ppv-note">Supliment alimentar. Nu înlocuiește o dietă variată și echilibrată și un stil de viață sănătos.</p></div></div>';
    o += '</div></section>';
    document.getElementById('ppv-root').innerHTML = o;

    var vs = document.getElementById('demo-var');
    vs.innerHTML = d.arome && d.arome.length ? 'Aromă (simulează selectorul din pagină): ' + list(d.arome, function (a) { return '<button type="button" data-v="' + e(a.varianta) + '" aria-pressed="' + (a.varianta === variant) + '">' + e(a.varianta) + '</button>'; }) : '';
    vs.onclick = function (ev) { var b = ev.target.closest('button'); if (b) render(h, b.getAttribute('data-v')); };
  }

  var nav = document.getElementById('demo-nav');
  var handles = Object.keys(ALL);
  nav.innerHTML = list(handles, function (h, i) { return '<button type="button" data-h="' + h + '" aria-pressed="' + (i === 0) + '">' + e(ALL[h].card_puncte.titlu.replace(/^Ce are /, '')) + '</button>'; });
  nav.onclick = function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    nav.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    var h = b.getAttribute('data-h'); render(h, ALL[h].arome && ALL[h].arome[0] ? ALL[h].arome[0].varianta : null);
  };
  render(handles[0], ALL[handles[0]].arome && ALL[handles[0]].arome[0] ? ALL[handles[0]].arome[0].varianta : null);
</script>
