<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototip pagină vizuală Prime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="liquid/assets/prime-pagina-vizuala.css">
<style>
  /* Doar pentru prototip (nu intră în temă). */
  body{margin:0;background:#f4f5f7;font-family:Poppins,sans-serif;color:#14171f}
  .demo-bar{background:#14171f;color:#fff;font-size:13px;padding:10px 16px;text-align:center}
  .demo-bar b{color:#ff6b6f}
  .demo-nav{max-width:1200px;margin:16px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px}
  .demo-nav button{font:600 14px Poppins,sans-serif;border:1px solid rgba(20,23,31,.15);background:#fff;border-radius:999px;padding:9px 18px;cursor:pointer}
  .demo-nav button[aria-pressed="true"]{background:#14171f;color:#fff;border-color:#14171f}
  .demo-var{max-width:1200px;margin:10px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#6b7280}
  .demo-var button{font:500 13px Poppins,sans-serif;border:1px solid rgba(20,23,31,.15);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
  .demo-var button[aria-pressed="true"]{border-color:#14171f;outline:1px solid #14171f}
</style>
</head>
<body>
<div class="demo-bar">Prototip local, <b>nu e pe site</b>. Același HTML ca secțiunea Liquid; datele vin din <code>date/*.json</code> (metafield-ul <code>prime.pagina_vizuala</code>).</div>
<nav class="demo-nav" id="demo-nav"></nav>
<div class="demo-var" id="demo-var"></div>
<div id="ppv-root"></div>

<script type="application/json" id="ppv-data">
__DATA__
</script>
<script>
  // Imaginile variantelor (în temă vin din Shopify; aici doar pentru produsele fără poză din ședință).
  var VAR_IMG = {
    'recovery-bcaa-500g': {
      Cherry: 'https://cdn.shopify.com/s/files/1/0917/5138/3415/files/01_PRIME_RECOVERYBCAA_Cherry_500g_front.jpg?v=1749666717',
      Pear: 'https://cdn.shopify.com/s/files/1/0917/5138/3415/files/01_PRIME_RECOVERYBCAA_Pear_500g_front.jpg?v=1749666717'
    }
  };
  var ALL = JSON.parse(document.getElementById('ppv-data').textContent);
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function todo(s) { return e(s).replace(/DE VERIFICAT/g, '<span class="ppv-todo">DE VERIFICAT</span>'); }
  function hl(s) { return todo(s).replace(/\[\[/g, '<strong class="ppv-hl">').replace(/\]\]/g, '</strong>'); }
  function list(a, f) { return (a || []).map(f).join(''); }
  function w(u, n) { return u + (u.indexOf('?') > -1 ? '&' : '?') + 'width=' + n; }

  function render(h, variant) {
    var d = ALL[h];
    var tema = ['albastru', 'verde', 'mov', 'portocaliu', 'roz'].indexOf(d.tema) > -1 ? d.tema : 'rosu';
    var vimg = VAR_IMG[h] && VAR_IMG[h][variant];
    var o = '<section class="ppv ppv--' + tema + '" id="ppv-demo" style="padding:24px 0 56px"><div class="ppv__wrap">';
    o += '<div class="ppv-panel ppv-hero"><div>';
    o += '<p class="ppv-badge">' + list(d.badge, function (b) { return '<span>' + e(b) + '</span>'; }) + '</p>';
    o += '<h2>' + e(d.titlu) + '</h2><p class="ppv-intro">' + hl(d.intro) + '</p>';
    o += '<ul class="ppv-tags">' + list(d.etichete, function (t) { return '<li>' + e(t) + '</li>'; }) + '</ul>';
    o += '<ul class="ppv-stats">' + list(d.cifre, function (c) { return '<li class="ppv-stat"><div class="ppv-stat__v">' + e(c.valoare) + (c.unitate ? '<small>' + e(c.unitate) + '</small>' : '') + '</div><div class="ppv-stat__l">' + e(c.eticheta) + '</div></li>'; }) + '</ul>';
    if (d.nota_cifre) o += '<p class="ppv-footnote">' + e(d.nota_cifre) + '</p>';
    o += '</div>';
    if (d.imagine && d.imagine.url) o += '<figure class="ppv-media"><img alt="' + e(d.imagine.alt) + '" src="' + w(d.imagine.url, 900) + '">';
    else o += '<figure class="ppv-media ppv-media--produs"><img alt="" src="' + (vimg ? w(vimg, 900) : '') + '">';
    o += '<div class="ppv-minis">' + list(d.mini_carduri, function (m) { return '<div class="ppv-mini"><b>' + e(m.titlu) + '</b><span>' + e(m.text) + '</span></div>'; }) + '</div></figure></div>';
    o += '<div class="ppv-two"><div class="ppv-card ppv-card--tint"><span class="ppv-kicker">' + e(d.card_formula.eticheta) + '</span><h3>' + e(d.card_formula.titlu) + '</h3><ul class="ppv-rows">';
    o += list(d.card_formula.randuri, function (r) { return '<li><span>' + e(r.nume) + '</span><b>' + e(r.valoare) + '</b></li>'; }) + '</ul></div>';
    o += '<div class="ppv-card"><span class="ppv-kicker">Pe scurt</span><h3>' + e(d.card_puncte.titlu) + '</h3><ul class="ppv-checks">' + list(d.card_puncte.puncte, function (p) { return '<li>' + e(p) + '</li>'; }) + '</ul></div></div>';
    o += '<div><div class="ppv-head"><span class="ppv-kicker">Formula</span><h3>' + e(d.carduri_ingrediente.titlu) + '</h3></div><div class="ppv-grid">';
    o += list(d.carduri_ingrediente.carduri, function (c) { return '<div class="ppv-ing"><span class="ppv-ing__code" aria-hidden="true">' + e(c.cod) + '</span><h4>' + e(c.titlu) + '</h4><p>' + e(c.text) + '</p></div>'; }) + '</div></div>';
    o += '<div class="ppv-two">';
    if (d.arome && d.arome.length) {
      o += '<div class="ppv-card"><span class="ppv-kicker">Arome</span><h3>' + d.arome.length + (d.arome.length === 1 ? ' aromă' : ' arome') + '</h3><ul class="ppv-flav">';
      o += list(d.arome, function (a) { return '<li data-ppv-flavour="' + e(a.varianta) + '" aria-current="' + (a.varianta === variant) + '"><b>' + e(a.nume) + '</b><span>' + todo(a.nota) + '</span></li>'; }) + '</ul></div>';
    }
    o += '<div class="ppv-card ppv-card--tint"><span class="ppv-kicker">Mod de folosire</span><h3>Cum îl prepari</h3><p>' + e(d.mod_de_folosire) + '</p><p class="ppv-note">Supliment alimentar. Nu înlocuiește o dietă variată și echilibrată și un stil de viață sănătos.</p></div></div>';
    o += '</div></section>';
    document.getElementById('ppv-root').innerHTML = o;

    var vs = document.getElementById('demo-var');
    vs.innerHTML = d.arome && d.arome.length ? 'Aromă (simulează selectorul din pagină): ' + list(d.arome, function (a) { return '<button type="button" data-v="' + e(a.varianta) + '" aria-pressed="' + (a.varianta === variant) + '">' + e(a.varianta) + '</button>'; }) : '';
    vs.onclick = function (ev) { var b = ev.target.closest('button'); if (b) render(h, b.getAttribute('data-v')); };
  }

  var nav = document.getElementById('demo-nav');
  var handles = Object.keys(ALL);
  nav.innerHTML = list(handles, function (h, i) { return '<button type="button" data-h="' + h + '" aria-pressed="' + (i === 0) + '">' + e(ALL[h].card_puncte.titlu.replace(/^Ce are /, '')) + '</button>'; });
  nav.onclick = function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    nav.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    var h = b.getAttribute('data-h'); render(h, ALL[h].arome && ALL[h].arome[0] ? ALL[h].arome[0].varianta : null);
  };
  render(handles[0], ALL[handles[0]].arome && ALL[handles[0]].arome[0] ? ALL[handles[0]].arome[0].varianta : null);
</script>
</body>
</html>
